name: Build dzttv.apk

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-dzttv-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    name: Build dzttv.apk
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: iptv_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename to dzttv.apk
        run: |
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/dzttv.apk
          ls -lh build/app/outputs/flutter-apk/dzttv.apk

      - name: Upload dzttv.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: dzttv-apk
          path: iptv_app/build/app/outputs/flutter-apk/dzttv.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish dzttv.apk release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dzttv.apk artifact
        uses: actions/download-artifact@v4
        with:
          name: dzttv-apk
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dzttv.apk
          generate_release_notes: true
